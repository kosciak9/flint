# =============================================================================
# Flint Image Build CI
# =============================================================================
# Builds and pushes the Flint image to GitHub Container Registry
# =============================================================================

name: Build Flint Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".gitignore"
  pull_request:
    branches:
      - main
  schedule:
    # Weekly rebuild on Sunday at 3:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      fedora_version:
        description: "Fedora version to build"
        required: false
        default: "44"

env:
  IMAGE_NAME: flint
  GHCR_REGISTRY: ghcr.io/${{ github.repository_owner }}
  # QUAY_REGISTRY: quay.io/${{ github.repository_owner }}
  FEDORA_VERSION: ${{ github.event.inputs.fedora_version || '44' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v9

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # - name: Login to Quay.io
      #   if: github.event_name != 'pull_request'
      #   uses: docker/login-action@v4
      #   with:
      #     registry: quay.io
      #     username: ${{ secrets.QUAY_USERNAME }}
      #     password: ${{ secrets.QUAY_PASSWORD }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}
            # ${{ env.QUAY_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ env.FEDORA_VERSION }},enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=
            type=ref,event=pr

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FEDORA_VERSION=${{ env.FEDORA_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.2
        with:
          # rpm-ostree/containers-image sigstoreSigned policies still discover
          # legacy Cosign attachments at sha256-<digest>.sig. Cosign v3 defaults
          # to OCI referrer-style artifacts that rpm-ostree cannot find yet.
          cosign-release: v2.6.1

      - name: Sign image with cosign
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          # Use --recursive to sign all platform manifests in the OCI image index
          # This is required for rpm-ostree signature verification which pulls by platform digest
          cosign sign --key env://COSIGN_PRIVATE_KEY --recursive --yes ${images}
